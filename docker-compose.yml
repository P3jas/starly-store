# Opcjonalne — jeśli nie masz już Postgresa w Dockerze.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: starly
    ports:
      - "5432:5432"
    volumes:
      - starly-db:/var/lib/postgresql/data

volumes:
  starly-db:
